# Nombre del microservicio
spring.application.name=usuarios-servicio
server.port=8082

# Config Server (carga desde GitHub o file:// si es local)
spring.config.import=optional:configserver:http://localhost:8888

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Base de datos H2 (puede cambiarse a MySQL/PostgreSQL si lo deseás)
spring.datasource.url=jdbc:h2:mem:usuariosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# Actuator: exponer métricas para monitoreo
management.endpoints.web.exposure.include=*
